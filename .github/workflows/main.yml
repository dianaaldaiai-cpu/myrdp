name: win 11 + 67
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP & Native Windows Firewall
        run: |
          # Enable Remote Desktop in Registry
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Enable built-in Windows Firewall Remote Desktop rules & open port 3389
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="RDP-Open-3389" 2>$null
          netsh advfirewall firewall add rule name="RDP-Open-3389" `
            dir=in action=allow protocol=TCP localport=3389 profile=any

          # Ensure portproxy listens on all interfaces
          netsh interface portproxy reset
          Restart-Service -Name TermService -Force

          # Get Public IP using native PowerShell
          $publicIP = (Invoke-RestMethod -Uri "https://api.ipify.org" -UseBasicParsing).Trim()
          echo "PUBLIC_IP=$publicIP" >> $env:GITHUB_ENV

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Verify Local RDP Port
        run: |
          $testResult = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "Local RDP port 3389 is not listening"
              exit 1
          }
          Write-Host "RDP Port 3389 is open and listening locally!"

      - name: Maintain Connection + Run Downloads.bat
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Public IP: $env:PUBLIC_IP`:3389"
          Write-Host "Username:  RDP"
          Write-Host "Password:  MR.English2008"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $publicStartup = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $downloadUrl = "
