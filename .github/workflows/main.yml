name: win 11 + RustDesk + Download.bat script

on:
  workflow_dispatch:

jobs:
  rustdesk-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Create RDP User & Prepare Startup
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString$password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue

      - name: Download, Install & Configure RustDesk
        run: |
          $ErrorActionPreference = "Stop"

          # Fetch latest RustDesk Windows x64 MSI/EXE release from GitHub API
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" -UseBasicParsing
          $asset =$release.assets | Where-Object { $_.name -match "x86_64\.msi$" } | Select-Object -First 1

          if (-not $asset) {
              $asset =$release.assets | Where-Object { $_.name -match "x86_64\.exe$" } | Select-Object -First 1
          }

          $installerPath = "$env:TEMP\$($asset.name)"
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile$installerPath -UseBasicParsing

          if ($installerPath -like "*.msi") {
              Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/qn", "/norestart" -Wait
          }
          else {
              Start-Process -FilePath $installerPath -ArgumentList "--silent-install" -Wait
          }

          Start-Sleep -Seconds 5
          $rustdeskExe = "$env:ProgramFiles\RustDesk\rustdesk.exe"

          # Ensure RustDesk service is running
          Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          # Set password and fetch RustDesk ID
          $rdPass = "MR.English2008" & $
